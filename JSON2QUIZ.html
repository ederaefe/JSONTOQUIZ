<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced UI Quiz App</title>
    <!-- Beautiful SVG Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #fcfcfd;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --pulse-grad: linear-gradient(135deg, #34d399 0%, #059669 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            transition: background 0.5s ease;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 700px;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* "Lovable" Success Animation */
        .immersive-success {
            background: var(--pulse-grad) !important;
            color: white !important;
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(16, 185, 129, 0.3);
            animation: beat 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .immersive-success * { color: white !important; border-color: rgba(255,255,255,0.3) !important; }

        @keyframes beat {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 30px 15px rgba(16, 185, 129, 0); }
            100% { transform: scale(1.02); }
        }

        /* Progress Bar Marker */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tag-btn {
            background: #fff7ed;
            color: #ea580c;
            border: 1px solid #fed7aa;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .tag-btn:hover { background: #ffedd5; }
        .tag-btn:focus-visible { outline: 2px solid #ea580c; outline-offset: 2px; }

        .question-text {
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        /* Options UI */
        .options-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }

        .option-label {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            border: 2px solid var(--border);
            transition: all 0.2s ease;
            font-size: 17px;
            background: white;
        }

        .option-label:hover { border-color: var(--primary); background: #f8fafc; }
        
        .option-label.selected {
            border-color: var(--primary);
            background: #eff6ff;
        }

        /* Highlight for keyboard navigation accessibility */
        .option-label:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .option-label input { margin-right: 15px; transform: scale(1.3); accent-color: var(--primary); outline: none; }
        
        .option-shortcut-hint {
            margin-left: auto;
            font-size: 12px;
            background: var(--border);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--text-muted);
        }

        .text-input {
            width: 100%;
            padding: 18px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-size: 18px;
            font-family: inherit;
            transition: border 0.2s;
        }
        .text-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }

        button.btn-main {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            flex: 1;
            transition: 0.2s;
        }
        button.btn-main:hover { background-color: #334155; transform: translateY(-1px); }
        button.btn-main:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        
        button.btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--border);
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        button.btn-secondary:hover { background: #f8fafc; }
        button.btn-secondary:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Setup Screen Additions */
        .config-group {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .json-textarea {
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            margin-bottom: 10px;
        }
        .json-textarea:focus { outline: none; border-color: var(--primary); }
        
        #setup-screen, #quiz-screen, #result-screen { display: none; }
        #setup-screen { display: block; }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        
        <!-- SETUP SCREEN -->
        <div id="setup-screen">
            <h2>✨ Start Your Quiz</h2>
            <p style="color: var(--text-muted);">Upload or paste your JSON file. The system features fuzzy text matching, review tags, and immersive feedback.</p>
            
            <div class="config-group">
                <label><strong>Feedback Mode:</strong></label><br><br>
                <label style="margin-right: 20px; cursor: pointer;">
                    <input type="radio" name="feedback-mode" value="immediate" checked> Immediate (Immersive UI)
                </label>
                <label style="cursor: pointer;">
                    <input type="radio" name="feedback-mode" value="end"> At the End (Review later)
                </label>
            </div>

            <div class="config-group">
                <label for="jsonFileInput"><strong>Upload Question JSON:</strong></label><br><br>
                <input type="file" id="jsonFileInput" accept=".json" style="width: 100%; cursor: pointer;">
            </div>

            <div class="config-group">
                <label for="jsonPasteInput"><strong>Or Paste JSON Data:</strong></label><br><br>
                <textarea id="jsonPasteInput" class="json-textarea" rows="4" placeholder='[
  {
    "question": "Sample Question?",
    "type": "single",
    "options": ["A", "B", "C"],
    "answer": "A"
  }
]'></textarea>
                <button class="btn-main" id="start-paste-btn" style="width: 100%;">Load Pasted JSON</button>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen">
            <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
            
            <div class="header-controls">
                <span id="question-counter" style="color: var(--text-muted); font-weight: 500;">Q 1/10</span>
                <button class="tag-btn" onclick="tagForLater()" tabindex="0">📌 Tag for Later</button>
            </div>
            
            <div class="question-text" id="question-text">Question goes here?</div>
            
            <div class="options-container" id="options-container"></div>
            
            <div class="nav-buttons">
                <button class="btn-secondary" id="prev-btn" onclick="goPrev()">Previous</button>
                <button class="btn-main" id="next-btn" onclick="handleNext()">Next</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen">
            <h2>Quiz Complete! 🎉</h2>
            <h1 style="font-size: 60px; color: var(--primary); margin: 10px 0;" id="score-display">0/0</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Check your performance below.</p>
            <div id="review-container" style="max-height: 400px; overflow-y: auto; text-align: left; margin-bottom: 20px;"></div>
            <button class="btn-main" onclick="location.reload()">Start Over</button>
        </div>

    </div>

    <script>
        let rawQuizData = [];
        let questionQueue = []; // Holds indexes. Allows us to push flagged questions to the back.
        let qIndex = 0; // Current position in the queue
        let userAnswers = {}; // Store answers by original question ID
        let feedbackMode = 'immediate';
        let isEvaluating = false; // prevents clicking next during animations

        // Setup Listeners
        document.getElementById('jsonFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            feedbackMode = document.querySelector('input[name="feedback-mode"]:checked').value;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    rawQuizData = JSON.parse(evt.target.result);
                    questionQueue = rawQuizData.map((_, i) => i);
                    startQuiz();
                } catch (err) { alert("Invalid JSON format in file."); }
            };
            reader.readAsText(file);
        });

        document.getElementById('start-paste-btn').addEventListener('click', function() {
            const pasteContent = document.getElementById('jsonPasteInput').value;
            if (!pasteContent.trim()) {
                alert("Please paste some JSON data first.");
                return;
            }
            feedbackMode = document.querySelector('input[name="feedback-mode"]:checked').value;
            try {
                rawQuizData = JSON.parse(pasteContent);
                questionQueue = rawQuizData.map((_, i) => i);
                startQuiz();
            } catch (err) { 
                alert("Invalid JSON format. Please check your syntax."); 
            }
        });

        function startQuiz() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            renderQuestion();
        }

        function renderQuestion() {
            const mainCard = document.getElementById('main-card');
            mainCard.classList.remove('immersive-success'); // Reset UI

            const realId = questionQueue[qIndex];
            const q = rawQuizData[realId];

            // Progress Bar
            const progress = ((qIndex) / questionQueue.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('question-counter').innerText = `Q ${qIndex + 1} of ${questionQueue.length}`;
            
            document.getElementById('question-text').innerText = q.question;
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            // Render Options
            if (q.type === 'single' || q.type === 'multiple') {
                const type = q.type === 'single' ? 'radio' : 'checkbox';
                q.options.forEach((opt, index) => {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = type;
                    input.name = 'q-opt';
                    input.value = opt;
                    input.tabIndex = 0; // Ensure focusable via keyboard
                    
                    // Restore previous answer if exists
                    if (userAnswers[realId]) {
                        if (type === 'radio' && userAnswers[realId] === opt) input.checked = true;
                        if (type === 'checkbox' && userAnswers[realId].includes(opt)) input.checked = true;
                    }

                    // Styling trick
                    input.addEventListener('change', () => {
                        if(type === 'radio') document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                        if(input.checked) label.classList.add('selected');
                        else label.classList.remove('selected');
                    });

                    if(input.checked) label.classList.add('selected');

                    const shortcutHint = document.createElement('span');
                    shortcutHint.className = 'option-shortcut-hint';
                    shortcutHint.innerText = index < 9 ? (index + 1) : '';

                    label.appendChild(input);
                    label.appendChild(document.createTextNode(opt));
                    if (index < 9) label.appendChild(shortcutHint);

                    container.appendChild(label);
                });
            } else if (q.type === 'text') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'text-input';
                input.id = 'text-input';
                input.placeholder = 'Type your answer...';
                if (userAnswers[realId]) input.value = userAnswers[realId];
                container.appendChild(input);
                
                // Auto-focus text input on render for quicker typing
                setTimeout(() => input.focus(), 50); 
            }

            document.getElementById('prev-btn').disabled = (qIndex === 0);
            document.getElementById('next-btn').innerText = (qIndex === questionQueue.length - 1) ? 'Finish' : 'Next';
        }

        // Fuzzy Matching: Levenshtein Distance
        function levenshtein(a, b) {
            if(a.length === 0) return b.length;
            if(b.length === 0) return a.length;
            let matrix = [];
            for(let i = 0; i <= b.length; i++) matrix[i] = [i];
            for(let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for(let i = 1; i <= b.length; i++) {
                for(let j = 1; j <= a.length; j++) {
                    if(b.charAt(i-1) === a.charAt(j-1)) matrix[i][j] = matrix[i-1][j-1];
                    else matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, Math.min(matrix[i][j-1] + 1, matrix[i-1][j] + 1));
                }
            }
            return matrix[b.length][a.length];
        }

        function isFuzzyMatch(input, target) {
            let dist = levenshtein(input.trim().toLowerCase(), target.trim().toLowerCase());
            let maxLen = Math.max(input.length, target.length);
            return ((maxLen - dist) / maxLen) >= 0.8; // 80% similarity threshold
        }

        function saveAnswer() {
            const realId = questionQueue[qIndex];
            const q = rawQuizData[realId];
            let ans = null;

            if (q.type === 'single') {
                const sel = document.querySelector('input[name="q-opt"]:checked');
                if (sel) ans = sel.value;
            } else if (q.type === 'multiple') {
                const sel = document.querySelectorAll('input[name="q-opt"]:checked');
                ans = Array.from(sel).map(n => n.value);
            } else if (q.type === 'text') {
                ans = document.getElementById('text-input').value;
            }
            userAnswers[realId] = ans || "";
            return ans;
        }

        function checkAnswer(realId, userAnswer) {
            const q = rawQuizData[realId];
            if (!userAnswer || userAnswer === "") return false;
            
            if (q.type === 'single') return userAnswer === q.answer;
            if (q.type === 'multiple') {
                const sortedU = [...userAnswer].sort().toString();
                const sortedA = [...q.answer].sort().toString();
                return sortedU === sortedA && userAnswer.length > 0;
            }
            if (q.type === 'text') return isFuzzyMatch(userAnswer, q.answer);
            return false;
        }

        function handleNext() {
            if (isEvaluating) return;
            const realId = questionQueue[qIndex];
            const ans = saveAnswer();

            if (feedbackMode === 'immediate') {
                const isCorrect = checkAnswer(realId, ans);
                if (isCorrect) {
                    // Trigger Lovable Success Animation
                    isEvaluating = true;
                    document.getElementById('main-card').classList.add('immersive-success');
                    setTimeout(() => {
                        isEvaluating = false;
                        advanceQueue();
                    }, 1200); // Wait for the "beat" to feel satisfying
                    return;
                } else if (ans !== "") {
                    // Quick red flash for incorrect
                    const card = document.getElementById('main-card');
                    card.style.border = "2px solid var(--danger)";
                    setTimeout(() => card.style.border = "none", 500);
                }
            }
            
            advanceQueue();
        }

        function goPrev() {
            if (qIndex > 0 && !isEvaluating) {
                saveAnswer();
                qIndex--;
                renderQuestion();
            }
        }

        function tagForLater() {
            if (isEvaluating) return;
            // Remove current from queue, push to the end
            const realId = questionQueue.splice(qIndex, 1)[0];
            questionQueue.push(realId);
            // Re-render current index (which is now the next question)
            renderQuestion();
        }

        function advanceQueue() {
            qIndex++;
            if (qIndex < questionQueue.length) {
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('main-card').classList.remove('immersive-success');

            let score = 0;
            const reviewDiv = document.getElementById('review-container');
            reviewDiv.innerHTML = '';

            rawQuizData.forEach((q, i) => {
                const uAns = userAnswers[i];
                const isCorrect = checkAnswer(i, uAns);
                if (isCorrect) score++;

                let displayUAns = Array.isArray(uAns) ? uAns.join(', ') : uAns;
                let displayCAns = Array.isArray(q.answer) ? q.answer.join(', ') : q.answer;

                reviewDiv.innerHTML += `
                    <div style="padding: 15px; border-radius: 12px; margin-bottom: 10px; background: ${isCorrect ? '#ecfdf5' : '#fef2f2'}; border: 1px solid ${isCorrect ? '#10b981' : '#ef4444'};">
                        <p style="margin:0 0 8px 0; font-weight: 500;">Q: ${q.question}</p>
                        <p style="margin:0; font-size: 14px;"><strong>Your Answer:</strong> ${displayUAns || '(Skipped)'}</p>
                        ${!isCorrect ? `<p style="margin:4px 0 0 0; font-size: 14px; color: var(--text-muted);"><strong>Correct:</strong> ${displayCAns}</p>` : ''}
                    </div>
                `;
            });

            document.getElementById('score-display').innerText = `${score} / ${rawQuizData.length}`;
        }

        // Keyboard Shortcuts Navigation
        document.addEventListener('keydown', function(e) {
            // Only apply shortcuts if the quiz screen is visible
            if (document.getElementById('quiz-screen').style.display !== 'block') return;
            if (isEvaluating) return;

            const activeEl = document.activeElement;
            const isTyping = activeEl && activeEl.tagName.toLowerCase() === 'input' && activeEl.type === 'text';

            // Global navigation overrides
            if (e.key === 'Enter') {
                e.preventDefault(); // Prevent standard form submissions/button clicks running twice
                handleNext();
            } else if (e.key === 'ArrowRight' && !isTyping) {
                handleNext();
            } else if (e.key === 'ArrowLeft' && !isTyping) {
                goPrev();
            }

            // Quick select for options 1-9
            if (!isTyping && e.key >= '1' && e.key <= '9') {
                const index = parseInt(e.key) - 1;
                const options = document.querySelectorAll('.option-label input');
                if (options[index]) {
                    options[index].click(); // Simulate clicking the radio/checkbox
                }
            }
        });
    </script>
</body>
</html>
